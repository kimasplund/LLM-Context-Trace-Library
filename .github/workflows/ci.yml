name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        core-only: [false]
        include:
          # 3.15: crewai caps pydantic<2.13 in the universal lock and pydantic-core 2.41.5 has
          # no cp315 wheel, so the dashboard deps can't install yet. Run the core suite with
          # only the `test` group until that cap lifts (spec follow-up 13).
          - python-version: "3.15"
            core-only: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - if: ${{ !matrix.core-only }}
        run: uv sync --locked
      - if: ${{ matrix.core-only }}
        run: uv sync --locked --no-default-groups --group test
      - name: Confirm interpreter matches the matrix
        run: uv run --no-sync python --version
      - if: ${{ !matrix.core-only }}
        run: uv run --no-sync pytest
      - if: ${{ matrix.core-only }}
        run: uv run --no-sync pytest --no-cov
      - name: Run the core span demo and render its tree
        env:
          SCRATCH: ${{ runner.temp }}/spans
        run: |
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          uv run --no-sync --project "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/examples/spans_demo.py"
          uv run --no-sync --project "$GITHUB_WORKSPACE" lctl trace --tree spans_demo.lctl.json

  package:
    name: Build and check wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv build
      - run: python3 scripts/check_wheel.py dist/*.whl
      - name: Install the wheel into a clean env and run the CLI
        run: |
          uv venv "$RUNNER_TEMP/wheeltest"
          uv pip install --python "$RUNNER_TEMP/wheeltest" dist/*.whl
          "$RUNNER_TEMP/wheeltest/bin/lctl" --version | grep -F "4.1.0"

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vscode-lctl/package-lock.json
            vscode-lctl/webview-ui/package-lock.json
      - run: npm ci
        working-directory: vscode-lctl/webview-ui
      - run: npm ci
        working-directory: vscode-lctl
      - run: npm run lint
        working-directory: vscode-lctl
      - run: npm run compile
        working-directory: vscode-lctl
      - run: npm run build:webview
        working-directory: vscode-lctl
      - run: npm test
        working-directory: vscode-lctl

  integrations:
    name: Integration (${{ matrix.extra }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        extra: [langchain, crewai, openai-agents, pydantic-ai, semantic-kernel, dspy, llamaindex]
        include:
          - {extra: langchain, example: langchain_example.py}
          - {extra: crewai, example: crewai_example.py}
          - {extra: openai-agents, example: openai_agents_example.py}
          - {extra: pydantic-ai, example: pydantic_ai_example.py}
          - {extra: semantic-kernel, example: semantic_kernel_example.py}
          - {extra: dspy, example: dspy_example.py}
          - {extra: llamaindex, example: llamaindex_example.py}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          python-version: "3.13"
      - name: Sync the extra's environment
        env:
          EXTRA: ${{ matrix.extra }}
        run: uv sync --locked --extra "$EXTRA"
      - name: Live framework tests
        run: uv run --no-sync pytest -m integration -q --no-cov -rs tests/integration
      - name: Run the extra's example and render its span tree
        env:
          EXAMPLE: ${{ matrix.example }}
          SCRATCH: ${{ runner.temp }}/example
        run: |
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          uv run --no-sync --project "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/examples/$EXAMPLE"
          trace=$(ls ./*_trace.lctl.json)
          test -s "$trace"
          uv run --no-sync --project "$GITHUB_WORKSPACE" lctl trace --tree "$trace"
