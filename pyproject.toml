[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lctl"
dynamic = ["version"]
description = "Time-travel debugging for multi-agent LLM workflows"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "LCTL Contributors" }
]
keywords = [
    "llm",
    "agents",
    "debugging",
    "observability",
    "multi-agent",
    "tracing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "packaging>=21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
]
langchain = [
    "langchain>=1.2.3",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
]
crewai = [
    "crewai>=1.8.0",
]
openai-agents = [
    "openai-agents>=0.1.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.14",
]
semantic-kernel = [
    "semantic-kernel>=1.0.0",
]
dspy = [
    "dspy>=2.5.0",
]
llamaindex = [
    "llama-index>=0.10.0",
]
all = [
    "lctl[dashboard,langchain,crewai,openai-agents,pydantic-ai,semantic-kernel,dspy,llamaindex]",
]

[project.scripts]
lctl = "lctl.cli.main:main"

[project.urls]
Homepage = "https://github.com/kimasplund/LLM-Context-Trace-Library"
Documentation = "https://github.com/kimasplund/LLM-Context-Trace-Library#readme"
Repository = "https://github.com/kimasplund/LLM-Context-Trace-Library"
Issues = "https://github.com/kimasplund/LLM-Context-Trace-Library/issues"

[dependency-groups]
# Test runner only: enough for the core suite (the CI 3.15 cell installs just this).
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "anyio>=4.0",  # tests/test_streaming.py runs its event loops with anyio.run
]
dev = [
    { include-group = "test" },
    "httpx2>=2.13",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML",
    "pre-commit>=4.7",
    # Mirror of the `dashboard` extra. Listed directly rather than as "lctl[dashboard]"
    # so `pip install --group dev` can never resolve a package named lctl from PyPI.
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
]

[tool.hatch.version]
path = "lctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lctl"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PIE", "RUF", "S", "ASYNC", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"benchmarks/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
files = ["lctl"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "langchain.*", "langchain_core.*", "crewai.*",
    "agents.*", "pydantic_ai.*", "semantic_kernel.*", "dspy.*", "llama_index.*",
    "slowapi.*", "uvicorn.*", "websockets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=lctl", "--cov-report=term-missing"]
filterwarnings = [
    "error",
    # slowapi (dashboard rate limiting) calls asyncio.iscoroutinefunction, deprecated in 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["lctl"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 78
